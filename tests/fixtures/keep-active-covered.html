<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <title>단추로 덮인 시험 페이지</title>

      body {
        margin: 0;
      }
      button {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <button type="button">화면 전체 단추</button>
  </body>
